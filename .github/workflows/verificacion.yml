name: Verificación del proyecto

on:
  workflow_dispatch:
  push:
    paths:
      - 'Fase2/Aplicacion/backend/**'
      - 'Fase2/Aplicacion/frontend/**'
      - 'Fase2/Aplicacion/infra/**'
      - 'Fase2/Aplicacion/compose*.yaml'
      - '.github/workflows/verificacion.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Fase2/Aplicacion
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Construir las imágenes
        run: docker compose -f compose.yaml -f compose.ops.yaml --profile test --profile ui build
      - name: Iniciar el laboratorio y las bases de prueba
        run: docker compose -f compose.yaml -f compose.ops.yaml --profile test --profile ui up -d --wait firestore firestore-test ops-lab ops-bridge
      - name: Ejecutar pruebas y compilación
        run: node backend/dev/verify-phase2.mjs --output .local/verificacion-ci
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resultados-verificacion
          path: Fase2/Aplicacion/.local/verificacion-ci/
          if-no-files-found: warn
          retention-days: 30
      - name: Detener el entorno del runner
        if: always()
        run: docker compose -f compose.yaml -f compose.ops.yaml --profile test --profile ui down --volumes
