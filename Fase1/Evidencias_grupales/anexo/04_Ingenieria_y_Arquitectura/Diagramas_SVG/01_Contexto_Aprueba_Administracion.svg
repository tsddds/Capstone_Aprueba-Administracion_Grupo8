<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1170" viewBox="0 0 1800 1170" role="img" aria-label="Contexto del backend administrativo"><defs><marker id="solid" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#65798A"/></marker><marker id="open" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#65798A" stroke-width="1.5"/></marker></defs><rect width="1800" height="1170" fill="#F3F7FA"/><rect width="1800" height="105" fill="#163651"/><text x="45" y="48" font-family="Arial, sans-serif" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="start">Contexto del backend administrativo</text><text x="45" y="83" font-family="Arial, sans-serif" font-size="20" fill="#DCE8F0" font-weight="400" text-anchor="start">Alcance, usuarios e integraciones; proveedores y mecanismos todavía pendientes.</text><rect x="70" y="215" width="350" height="170" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="90" y="249" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="700" text-anchor="start">Personal administrativo</text><text x="90" y="285" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">Roles: admin, finance,</text><text x="90" y="313.35" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">ops y support.</text><text x="90" y="341.7" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">Opera desde un cliente HTTP.</text><rect x="565" y="280" width="610" height="270" rx="0" fill="#E9F2F8" stroke="#B3C5D0" stroke-width="2" /><text x="585" y="314" font-family="Arial, sans-serif" font-size="28" fill="#203044" font-weight="700" text-anchor="start">Backend Aprueba Administración</text><text x="585" y="350" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="400" text-anchor="start">JavaScript · Node.js · Express</text><text x="585" y="382.4" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="400" text-anchor="start">27 endpoints /admin</text><text x="585" y="414.8" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="400" text-anchor="start">Autenticación, permisos y validación</text><text x="585" y="447.20000000000005" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="400" text-anchor="start">Datos y operaciones administrativas</text><rect x="1340" y="170" width="390" height="195" rx="0" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="1360" y="204" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="700" text-anchor="start">Base de datos</text><text x="1360" y="240" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="400" text-anchor="start">Entrega comprometida.</text><text x="1360" y="269.7" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="400" text-anchor="start">Código preparado para Firestore.</text><text x="1360" y="299.4" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="400" text-anchor="start">Accesos y esquema: Q01/Q02.</text><rect x="1340" y="445" width="390" height="225" rx="0" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="1360" y="479" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="700" text-anchor="start">Fuentes y operaciones</text><text x="1360" y="515" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">Métricas y plataformas.</text><text x="1360" y="543.35" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">Estado/reinicio de infraestructura.</text><text x="1360" y="571.7" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">Recompensas, notificaciones</text><text x="1360" y="600.05" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">y sincronización de precios.</text><text x="1360" y="628.4" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">Conexiones pendientes Q04–Q09.</text><rect x="70" y="660" width="350" height="165" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="90" y="694" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="700" text-anchor="start">Demostración</text><text x="90" y="730" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">Herramienta HTTP o tests.</text><text x="90" y="758.35" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">Interfaz mínima opcional.</text><text x="90" y="786.7" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="400" text-anchor="start">No requiere frontend completo.</text><polyline points="420,300 565,350" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#open)"/><text x="472" y="275" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="middle">solicita</text><polyline points="565,440 420,370" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#open)"/><text x="478" y="442" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="middle">responde</text><polyline points="1175,350 1260,350 1260,275 1340,275" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="1250" y="235" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="middle">lee / escribe</text><polyline points="1175,475 1260,475 1260,545 1340,545" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="1250" y="591" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">consulta /</text><text x="1250" y="613.95" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">solicita acción</text><polyline points="420,710 505,710 505,500 565,500" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#open)"/><text x="725" y="700" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">El docente recibe demostración y evidencias académicas.</text><text x="725" y="740" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="400" text-anchor="start">No es un rol adicional de la API.</text><rect x="45" y="940" width="1710" height="135" rx="5" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="63" y="970" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Límite del producto: el bloque central. Datos y servicios a la derecha son dependencias, no otros productos a desarrollar.</text><text x="63" y="995.65" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Continua = interacción prevista; discontinua = conexión concreta pendiente. Las flechas nombran la interacción, no el estado de ejecución.</text><text x="63" y="1021.3" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Q01–Q12 siguen NO FORMULADAS. No se afirma acceso a cuentas, proveedores ni servicios operativos.</text><text x="63" y="1046.95" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Frontend del alumno, aplicación móvil y generador permanecen fuera del alcance.</text><polyline points="45,1112 1755,1112" fill="none" stroke="#B3C5D0" stroke-width="2"  /><text x="45" y="1142" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Aprueba Administración · Fase 1 · Diseño propuesto, no implementación verificada</text><text x="1550" y="1142" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Revisión 2026-09-11</text></svg>