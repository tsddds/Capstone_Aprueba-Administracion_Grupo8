<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460" role="img" aria-label="Despliegue UML · entornos propuestos"><defs><marker id="solid" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#65798A"/></marker><marker id="open" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#65798A" stroke-width="1.5"/></marker></defs><rect width="1800" height="1460" fill="#F3F7FA"/><rect width="1800" height="105" fill="#163651"/><text x="45" y="48" font-family="Arial, sans-serif" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="start">Despliegue UML · entornos propuestos</text><text x="45" y="83" font-family="Arial, sans-serif" font-size="20" fill="#DCE8F0" font-weight="400" text-anchor="start">Pruebas y producción diferenciados; nodos lógicos, runtime y artefacto. No es un despliegue realizado.</text><rect x="55" y="200" width="760" height="580" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><text x="75" y="238" font-family="Arial, sans-serif" font-size="27" fill="#203044" font-weight="700" text-anchor="start">«node» Entorno de pruebas</text><rect x="95" y="290" width="680" height="285" rx="0" fill="#E9F2F8" stroke="#27658C" stroke-width="2" /><text x="115" y="325" font-family="Arial, sans-serif" font-size="25" fill="#203044" font-weight="700" text-anchor="start">«executionEnvironment» Node.js</text><rect x="135" y="370" width="600" height="150" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="155" y="404" font-family="Arial, sans-serif" font-size="25" fill="#203044" font-weight="700" text-anchor="start">«artifact» Backend administrativo</text><text x="155" y="440" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">JavaScript + Express · 27 endpoints</text><text x="155" y="471.05" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Configuración propia del entorno</text><rect x="95" y="640" width="680" height="100" rx="0" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="115" y="674" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Configuración y credenciales del entorno</text><text x="115" y="710" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">No incluidas en el diagrama ni en el repositorio.</text><rect x="985" y="200" width="760" height="580" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><text x="1005" y="238" font-family="Arial, sans-serif" font-size="27" fill="#203044" font-weight="700" text-anchor="start">«node» Entorno productivo</text><rect x="1025" y="290" width="680" height="285" rx="0" fill="#E9F2F8" stroke="#27658C" stroke-width="2" /><text x="1045" y="325" font-family="Arial, sans-serif" font-size="25" fill="#203044" font-weight="700" text-anchor="start">«executionEnvironment» Node.js</text><rect x="1065" y="370" width="600" height="150" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="1085" y="404" font-family="Arial, sans-serif" font-size="25" fill="#203044" font-weight="700" text-anchor="start">«artifact» Backend administrativo</text><text x="1085" y="440" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">JavaScript + Express · 27 endpoints</text><text x="1085" y="471.05" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Configuración propia del entorno</text><rect x="1025" y="640" width="680" height="100" rx="0" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="1045" y="674" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Configuración y credenciales del entorno</text><text x="1045" y="710" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">No incluidas en el diagrama ni en el repositorio.</text><rect x="80" y="845" width="350" height="145" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="100" y="879" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="700" text-anchor="start">Cliente de pruebas</text><text x="100" y="915" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Solicitudes HTTP</text><text x="100" y="946.05" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">y pruebas automatizadas</text><rect x="1370" y="845" width="350" height="145" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="1390" y="879" font-family="Arial, sans-serif" font-size="24" fill="#203044" font-weight="700" text-anchor="start">Cliente administrativo</text><text x="1390" y="915" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Operación autorizada</text><text x="1390" y="946.05" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">mediante HTTPS</text><polyline points="255,845 255,780" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#open)"/><text x="273" y="819" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">HTTPS</text><polyline points="1545,845 1545,780" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#open)"/><text x="1563" y="819" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">HTTPS</text><rect x="605" y="835" width="570" height="175" rx="0" fill="#E9F2F8" stroke="#B3C5D0" stroke-width="2" /><text x="625" y="869" font-family="Arial, sans-serif" font-size="25" fill="#203044" font-weight="700" text-anchor="start">Proceso de entrega (fuera del runtime)</text><text x="625" y="905" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Verificar → probar → desplegar.</text><text x="625" y="936.05" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Mecanismo/herramienta por confirmar.</text><text x="625" y="967.1" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Promoción productiva autorizada: Q12.</text><polyline points="640,835 640,795 795,795 795,580" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><polyline points="1140,835 1140,795 1005,795 1005,580" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><rect x="55" y="1070" width="760" height="140" rx="0" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="75" y="1104" font-family="Arial, sans-serif" font-size="25" fill="#203044" font-weight="700" text-anchor="start">Dependencias de prueba</text><text x="75" y="1140" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">BD y servicios permitidos para pruebas.</text><text x="75" y="1171.05" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Accesos, aislamiento y mecanismos: Q02/Q04–Q09.</text><rect x="985" y="1070" width="760" height="140" rx="0" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="1005" y="1104" font-family="Arial, sans-serif" font-size="25" fill="#203044" font-weight="700" text-anchor="start">Dependencias productivas</text><text x="1005" y="1140" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">BD y servicios autorizados para producción.</text><text x="1005" y="1171.05" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="400" text-anchor="start">Proveedor, recursos y permisos aún pendientes.</text><polyline points="55,600 25,600 25,1025 140,1025 140,1070" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#open)"/><polyline points="1745,600 1775,600 1775,1025 1660,1025 1660,1070" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#open)"/><rect x="45" y="1250" width="1710" height="115" rx="5" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="63" y="1280" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Propuesta de separación de entornos; no afirma dos servidores ya provisionados ni bases físicas independientes.</text><text x="63" y="1305.65" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Continua = comunicación prevista; discontinua = entrega de artefacto. Nodos lógicos: no se especifica nube, región ni dominio.</text><text x="63" y="1331.3" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Empaquetado y exigencias académicas de contenedores se resolverán sin asumir la plataforma real del cliente. Q07/Q12 pendientes.</text><polyline points="45,1402 1755,1402" fill="none" stroke="#B3C5D0" stroke-width="2"  /><text x="45" y="1432" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Aprueba Administración · Fase 1 · Diseño propuesto, no implementación verificada</text><text x="1550" y="1432" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Revisión 2026-09-11</text></svg>