<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1430" viewBox="0 0 1800 1430" role="img" aria-label="Secuencia UML · consultar detalle de usuario"><defs><marker id="solid" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#65798A"/></marker><marker id="open" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#65798A" stroke-width="1.5"/></marker></defs><rect width="1800" height="1430" fill="#F3F7FA"/><rect width="1800" height="105" fill="#163651"/><text x="45" y="48" font-family="Arial, sans-serif" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="start">Secuencia UML · consultar detalle de usuario</text><text x="45" y="83" font-family="Arial, sans-serif" font-size="20" fill="#DCE8F0" font-weight="400" text-anchor="start">Caso concreto: GET /admin/users/{id} · roles permitidos admin y support · contrato sección 4.</text><rect x="25" y="145" width="250" height="72" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="45" y="179" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="700" text-anchor="start">Cliente HTTP</text><polyline points="150,217 150,1220" fill="none" stroke="#B3C5D0" stroke-width="2" stroke-dasharray="9 6" /><rect x="350" y="145" width="250" height="72" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="370" y="179" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="700" text-anchor="start">API / controlador</text><polyline points="475,217 475,1220" fill="none" stroke="#B3C5D0" stroke-width="2" stroke-dasharray="9 6" /><rect x="675" y="145" width="250" height="72" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="695" y="179" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="700" text-anchor="start">Autorización</text><polyline points="800,217 800,1220" fill="none" stroke="#B3C5D0" stroke-width="2" stroke-dasharray="9 6" /><rect x="1035" y="145" width="250" height="72" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="1055" y="179" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="700" text-anchor="start">Servicio usuarios</text><polyline points="1160,217 1160,1220" fill="none" stroke="#B3C5D0" stroke-width="2" stroke-dasharray="9 6" /><rect x="1435" y="145" width="250" height="72" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="1455" y="179" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="700" text-anchor="start">Acceso a datos</text><polyline points="1560,217 1560,1220" fill="none" stroke="#B3C5D0" stroke-width="2" stroke-dasharray="9 6" /><polyline points="150,265 475,265" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#solid)"/><text x="312.5" y="252" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">GET /admin/users/{id} + token</text><polyline points="475,325 800,325" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#solid)"/><text x="637.5" y="312" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">Comprobar token y rol</text><polyline points="800,385 475,385" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="637.5" y="372" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">Resultado de autorización</text><rect x="55" y="420" width="1685" height="795" rx="0" fill="none" stroke="#65798A" stroke-width="2" /><rect x="55" y="420" width="70" height="34" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><text x="67" y="444" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">alt</text><text x="75" y="482" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">[token ausente o inválido]</text><polyline points="475,535 150,535" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="312.5" y="522" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">401 · AUTH_REQUIRED</text><polyline points="55,570 1740,570" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" /><text x="75" y="608" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">[token válido, rol distinto de admin/support]</text><polyline points="475,660 150,660" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="312.5" y="647" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">403 · AUTH_FORBIDDEN</text><polyline points="55,695 1740,695" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" /><text x="75" y="735" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">[rol admin o support autorizado]</text><polyline points="475,790 1160,790" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#solid)"/><text x="817.5" y="777" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">Consultar usuario(id)</text><polyline points="1160,845 1560,845" fill="none" stroke="#65798A" stroke-width="2"  marker-end="url(#solid)"/><text x="1360" y="832" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">Buscar registro autorizado</text><polyline points="1560,900 1160,900" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="1360" y="887" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">Registro o ausencia</text><polyline points="1160,955 475,955" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="817.5" y="942" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">Resultado de consulta</text><rect x="90" y="990" width="1590" height="195" rx="0" fill="none" stroke="#65798A" stroke-width="2" /><rect x="90" y="990" width="68" height="32" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><text x="102" y="1014" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="700" text-anchor="start">alt</text><text x="720" y="1024" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="700" text-anchor="start">[usuario existe]</text><polyline points="475,1055 150,1055" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="312.5" y="1042" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">200 · data: detalle, error: null</text><polyline points="90,1085 1680,1085" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" /><text x="720" y="1120" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="700" text-anchor="start">[usuario no existe]</text><polyline points="475,1153 150,1153" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="312.5" y="1140" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="middle">404 · NOT_FOUND</text><rect x="45" y="1250" width="1710" height="90" rx="5" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="63" y="1280" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Línea continua + punta llena: llamada síncrona. Línea discontinua + punta abierta: respuesta. Tiempo de arriba hacia abajo.</text><text x="63" y="1305.65" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Ramas excluyentes: 401/403 no consultan datos. Flujo propuesto; nombres de componentes no equivalen a archivos verificados.</text><text x="63" y="1331.3" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">El esquema de la BD sigue pendiente; no se simula una respuesta real ni se presenta una prueba ejecutada.</text><polyline points="45,1372 1755,1372" fill="none" stroke="#B3C5D0" stroke-width="2"  /><text x="45" y="1402" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Aprueba Administración · Fase 1 · Diseño propuesto, no implementación verificada</text><text x="1550" y="1402" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Revisión 2026-09-11</text></svg>