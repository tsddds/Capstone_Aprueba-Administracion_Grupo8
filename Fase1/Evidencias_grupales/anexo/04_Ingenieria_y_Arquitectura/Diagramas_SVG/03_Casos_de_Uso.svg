h="1710" height="92" rx="5" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="63" y="1320" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">14 casos agrupados → 27 endpoints (1 login público + 26 operaciones protegidas). El detalle está en TRAZABILIDAD_CASOS_USO.csv.</text><text x="63" y="1345.65" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Línea continua: participación del actor. Login disponible para cada rol; las demás operaciones requieren token y permisos.</text><text x="63" y="1371.3" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">No se incorporan include/extend artificiales. Los actores representan roles, no personas ni una única cuenta.</text><polyline points="45,1422 1755,1422" fill="none" stroke="#B3C5D0" stroke-width="2"  /><text x="45" y="1452" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Aprueba Administración · Fase 1 · Diseño propuesto, no implementación verificada</text><text x="1550" y="1452" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Revisión 2026-09-11</text></svg>