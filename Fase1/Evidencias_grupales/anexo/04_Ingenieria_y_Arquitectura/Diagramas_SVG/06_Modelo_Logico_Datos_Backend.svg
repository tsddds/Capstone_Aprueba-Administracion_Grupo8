<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510" role="img" aria-label="Modelo lógico de datos · propuesta documental"><defs><marker id="solid" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#65798A"/></marker><marker id="open" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#65798A" stroke-width="1.5"/></marker></defs><rect width="1800" height="1510" fill="#F3F7FA"/><rect width="1800" height="105" fill="#163651"/><text x="45" y="48" font-family="Arial, sans-serif" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="start">Modelo lógico de datos · propuesta documental</text><text x="45" y="83" font-family="Arial, sans-serif" font-size="20" fill="#DCE8F0" font-weight="400" text-anchor="start">Conceptos separados, vínculos del contrato y multiplicidades propuestas; no es el esquema físico de la base entregada.</text><rect x="40" y="140" width="1720" height="460" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="60" y="175" font-family="Arial, sans-serif" font-size="26" fill="#203044" font-weight="700" text-anchor="start">A · Soporte y calidad de preguntas</text><rect x="80" y="220" width="280" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="80" y="220" width="280" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="95" y="248" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Usuario</text><text x="95" y="288" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · perfil · estado</text><text x="95" y="315" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">plan · datos de soporte</text><rect x="500" y="220" width="280" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="500" y="220" width="280" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="515" y="248" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Ticket</text><text x="515" y="288" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · usuario · prioridad</text><text x="515" y="315" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">estado · agente · respuesta</text><rect x="940" y="220" width="300" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="940" y="220" width="300" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="955" y="248" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Recorrección</text><text x="955" y="288" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · userId · questionId</text><text x="955" y="315" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">reason · state · resolución</text><rect x="1380" y="220" width="300" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="1380" y="220" width="300" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="1395" y="248" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Pregunta</text><text x="1395" y="288" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · testId · axis</text><text x="1395" y="315" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">options · correctAnswer</text><text x="1395" y="342" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">status · explanation</text><polyline points="360,290 500,290" fill="none" stroke="#65798A" stroke-width="2"  /><text x="369" y="277" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">1</text><text x="464" y="277" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="430" y="319" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">presenta</text><polyline points="1240,290 1380,290" fill="none" stroke="#65798A" stroke-width="2"  /><text x="1249" y="277" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="1344" y="277" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">1</text><text x="1310" y="319" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">sobre</text><polyline points="220,365 220,435 1090,435 1090,365" fill="none" stroke="#65798A" stroke-width="2"  /><text x="230" y="392" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">1</text><text x="1100" y="392" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="650" y="425" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="middle">Usuario presenta recorrecciones</text><rect x="80" y="475" width="1600" height="88" rx="5" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="98" y="505" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Confirmar una recorrección: +250 medallas de bronce y notificación; corrección de pregunta opcional (contrato).</text><text x="98" y="530.65" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">El saldo/movimiento de recompensa y el canal de notificación se vincularán al mecanismo entregado; Q08 sin respuesta.</text><rect x="40" y="625" width="1720" height="320" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="60" y="661" font-family="Arial, sans-serif" font-size="26" fill="#203044" font-weight="700" text-anchor="start">B · Suscripciones y catálogo comercial</text><rect x="80" y="715" width="280" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="80" y="715" width="280" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="95" y="743" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Usuario (referencia)</text><text x="95" y="783" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Misma entidad del bloque A.</text><text x="95" y="810" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">No se duplica su colección</text><rect x="500" y="715" width="280" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="500" y="715" width="280" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="515" y="743" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Suscripción</text><text x="515" y="783" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · status</text><text x="515" y="810" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">usuario y plan asociados</text><rect x="940" y="715" width="300" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="940" y="715" width="300" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="955" y="743" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Plan</text><text x="955" y="783" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · name · price</text><text x="955" y="810" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">features · limits</text><rect x="1380" y="715" width="300" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="1380" y="715" width="300" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="1395" y="743" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Funcionalidad</text><text x="1395" y="783" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · name</text><polyline points="360,784 500,784" fill="none" stroke="#65798A" stroke-width="2"  /><text x="369" y="771" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">1</text><text x="464" y="771" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="430" y="813" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">mantiene</text><polyline points="780,784 940,784" fill="none" stroke="#65798A" stroke-width="2"  /><text x="789" y="771" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="904" y="771" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">1</text><text x="860" y="813" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">corresponde a</text><polyline points="1240,784 1380,784" fill="none" stroke="#65798A" stroke-width="2"  /><text x="1249" y="771" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="1344" y="771" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="1310" y="813" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">incluye</text><text x="80" y="907" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Regla: no eliminar un plan con suscripciones activas. Sincronización de precios descrita con Stripe; conexión pendiente (Q09).</text><rect x="40" y="975" width="830" height="285" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="60" y="1011" font-family="Arial, sans-serif" font-size="26" fill="#203044" font-weight="700" text-anchor="start">C · Patrocinio</text><rect x="70" y="1050" width="310" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="70" y="1050" width="310" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="85" y="1078" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Patrocinador</text><text x="85" y="1118" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · name · tier</text><text x="85" y="1145" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">monthlyFee · status</text><rect x="530" y="1050" width="310" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="530" y="1050" width="310" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="545" y="1078" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Beneficio</text><text x="545" y="1118" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">name · description</text><text x="545" y="1145" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">costPlatinum · stock</text><polyline points="380,1120 530,1120" fill="none" stroke="#65798A" stroke-width="2"  /><text x="389" y="1107" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">1</text><text x="494" y="1107" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="455" y="1149" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">ofrece</text><rect x="900" y="975" width="860" height="285" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="920" y="1011" font-family="Arial, sans-serif" font-size="26" fill="#203044" font-weight="700" text-anchor="start">D · Trazabilidad administrativa</text><rect x="930" y="1050" width="310" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="930" y="1050" width="310" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="945" y="1078" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Usuario administrativo</text><text x="945" y="1118" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">id · identidad · rol</text><text x="945" y="1145" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">admin / finance / ops / support</text><rect x="1410" y="1050" width="320" height="145" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><rect x="1410" y="1050" width="320" height="40" rx="0" fill="#E9F2F8" stroke="#65798A" stroke-width="2" /><text x="1425" y="1078" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">Evento de auditoría</text><text x="1425" y="1118" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">actor · acción · recurso</text><text x="1425" y="1145" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">resultado · fecha (propuesta)</text><polyline points="1240,1120 1410,1120" fill="none" stroke="#65798A" stroke-width="2"  /><text x="1249" y="1107" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">1</text><text x="1374" y="1107" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">0..*</text><text x="1325" y="1149" font-family="Arial, sans-serif" font-size="17" fill="#203044" font-weight="400" text-anchor="middle">registra</text><rect x="45" y="1290" width="1710" height="123" rx="5" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="63" y="1320" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Lecturas operativas separadas: Platform, Service, Container y métricas. No se presupone que sean colecciones propias.</text><text x="63" y="1345.65" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Relaciones y multiplicidades = propuesta lógica; confirmar cardinalidades, referencias y nombres físicos con Q01/Q02.</text><text x="63" y="1371.3" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Orientación documental compatible con el código Firestore; no implica tablas SQL ni claves foráneas implementadas.</text><text x="63" y="1396.95" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">La asignación a documentos, campos embebidos o referencias se cerrará al recibir el esquema. Sin datos reales.</text><polyline points="45,1452 1755,1452" fill="none" stroke="#B3C5D0" stroke-width="2"  /><text x="45" y="1482" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Aprueba Administración · Fase 1 · Diseño propuesto, no implementación verificada</text><text x="1550" y="1482" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Revisión 2026-09-11</text></svg>