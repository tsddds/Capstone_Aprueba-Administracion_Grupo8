<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" role="img" aria-label="Componentes UML · dependencias propuestas"><defs><marker id="solid" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#65798A"/></marker><marker id="open" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#65798A" stroke-width="1.5"/></marker></defs><rect width="1800" height="1210" fill="#F3F7FA"/><rect width="1800" height="105" fill="#163651"/><text x="45" y="48" font-family="Arial, sans-serif" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="start">Componentes UML · dependencias propuestas</text><text x="45" y="83" font-family="Arial, sans-serif" font-size="20" fill="#DCE8F0" font-weight="400" text-anchor="start">La tecnología base se conserva; la división interna se validará al revisar el código.</text><rect x="385" y="145" width="985" height="840" rx="0" fill="#FFFFFF" stroke="#65798A" stroke-width="2" /><text x="410" y="179" font-family="Arial, sans-serif" font-size="25" fill="#203044" font-weight="700" text-anchor="start">Backend · JavaScript / Node.js / Express (base confirmada)</text><rect x="660" y="225" width="410" height="155" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="680" y="257" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">«component»</text><text x="680" y="286" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">Entrada HTTP / API</text><text x="680" y="330" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Rutas y formato de respuesta</text><rect x="425" y="470" width="380" height="155" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="445" y="502" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">«component»</text><text x="445" y="531" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">Identidad y validación</text><text x="445" y="575" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Token, rol y entrada</text><rect x="950" y="470" width="380" height="155" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="970" y="502" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">«component»</text><text x="970" y="531" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">Servicios administrativos</text><text x="970" y="575" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Reglas y casos del contrato</text><rect x="425" y="760" width="380" height="165" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="445" y="792" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">«component»</text><text x="445" y="821" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">Acceso a datos</text><text x="445" y="865" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Persistencia desacoplada</text><text x="445" y="892" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Esquema por recibir</text><rect x="950" y="760" width="380" height="165" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="970" y="792" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">«component»</text><text x="970" y="821" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">Conexiones operativas</text><text x="970" y="865" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Adaptación a servicios</text><text x="970" y="892" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Mecanismos por confirmar</text><rect x="40" y="225" width="290" height="170" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="60" y="257" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">«component»</text><text x="60" y="286" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">Cliente HTTP</text><text x="60" y="330" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Tests / demo /</text><text x="60" y="357" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">interfaz mínima</text><rect x="1420" y="470" width="335" height="170" rx="0" fill="#FFFFFF" stroke="#B3C5D0" stroke-width="2" /><text x="1440" y="502" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">«component»</text><text x="1440" y="531" font-family="Arial, sans-serif" font-size="21" fill="#203044" font-weight="700" text-anchor="start">Registro y configuración</text><text x="1440" y="575" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Auditoría / parámetros</text><text x="1440" y="602" font-family="Arial, sans-serif" font-size="20" fill="#203044" font-weight="400" text-anchor="start">Secretos fuera del código</text><rect x="40" y="765" width="290" height="150" rx="0" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="60" y="799" font-family="Arial, sans-serif" font-size="23" fill="#203044" font-weight="700" text-anchor="start">«external» Datos</text><text x="60" y="835" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Código orientado a Firestore.</text><text x="60" y="859.3" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Cuenta/esquema pendientes.</text><rect x="1420" y="765" width="335" height="150" rx="0" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="1440" y="799" font-family="Arial, sans-serif" font-size="22" fill="#203044" font-weight="700" text-anchor="start">«external» Servicios</text><text x="1440" y="835" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Métricas, operación, avisos</text><text x="1440" y="860.65" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">y precios: Q04–Q09.</text><polyline points="330,300 660,300" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="480" y="286" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="middle">«use» HTTP</text><polyline points="750,380 750,425 615,425 615,470" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="604" y="414" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">«use»</text><polyline points="990,380 990,425 1140,425 1140,470" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="1110" y="414" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">«use»</text><polyline points="1040,625 1040,705 615,705 615,760" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="765" y="692" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">«use» persistencia</text><polyline points="1240,625 1240,760" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="1248" y="708" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">«use»</text><polyline points="1330,535 1420,535" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><text x="1362" y="516" font-family="Arial, sans-serif" font-size="16" fill="#203044" font-weight="400" text-anchor="start">«use»</text><polyline points="425,837 330,837" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><polyline points="1330,837 1420,837" fill="none" stroke="#65798A" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#open)"/><rect x="45" y="1020" width="1710" height="95" rx="5" fill="#FFF4DD" stroke="#B3C5D0" stroke-width="2" /><text x="63" y="1050" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Notación: componentes con estereotipo UML; flechas discontinuas del consumidor hacia su dependencia. No representan orden de ejecución.</text><text x="63" y="1075.65" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">Descomposición propuesta: no afirma carpetas, clases o módulos ya implementados. Los servicios administrativos dependen del acceso a datos</text><text x="63" y="1101.3" font-family="Arial, sans-serif" font-size="19" fill="#203044" font-weight="400" text-anchor="start">y de las conexiones requeridas; los proveedores externos y su reparto definitivo siguen pendientes.</text><polyline points="45,1152 1755,1152" fill="none" stroke="#B3C5D0" stroke-width="2"  /><text x="45" y="1182" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Aprueba Administración · Fase 1 · Diseño propuesto, no implementación verificada</text><text x="1550" y="1182" font-family="Arial, sans-serif" font-size="18" fill="#203044" font-weight="400" text-anchor="start">Revisión 2026-09-11</text></svg>